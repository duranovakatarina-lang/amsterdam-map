<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amsterdam 🌷 Zoznam miest</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F5F2;
  --white: #FFFFFF;
  --ink: #1A1714;
  --ink2: #6B6560;
  --ink3: #AEA9A4;
  --border: #E8E4DE;
  --border2: #D4CFC8;
  --accent: #C17B4A;

  --c-coffee:  #7C5C3E; --c-coffee-bg:  #F5EDE4; --c-coffee-border:  #D4B89A;
  --c-cs:      #4A7C59; --c-cs-bg:      #EAF3ED; --c-cs-border:      #9DCAAD;
  --c-brown:   #8B6914; --c-brown-bg:   #FBF4E3; --c-brown-border:   #D4B45A;
  --c-gastro:  #C14A4A; --c-gastro-bg:  #FBEDED; --c-gastro-border:  #E4A5A5;
  --c-nakupy:  #4A6E8C; --c-nakupy-bg:  #E8EFF5; --c-nakupy-border:  #9BBDD4;
  --c-zazitok: #7B4A8C; --c-zazitok-bg: #F2EAF5; --c-zazitok-border: #C49DD4;
  --c-hidden:  #3D7A6E; --c-hidden-bg:  #E5F2F0; --c-hidden-border:  #8CC4BC;
  --c-miesta:  #6E5C3D; --c-miesta-bg:  #F2EDE4; --c-miesta-border:  #C4AF8C;
  --c-natura:  #4A7A3D; --c-natura-bg:  #EAF2E8; --c-natura-border:  #9DC49A;
  --c-speakeasy:#2C3E6B; --c-speakeasy-bg:#EAEDf5; --c-speakeasy-border:#8B96C4;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; font-size: 14px; }

.header {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px 12px;
  position: sticky; top: 0; z-index: 100;
}
.header-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.header-top h1 { font-family: 'DM Serif Display', serif; font-size: 18px; font-weight: 400; letter-spacing: -0.02em; }
.header-top .sub { font-size: 12px; color: var(--ink3); }
.stats-row { display: flex; gap: 6px; flex-wrap: wrap; }
.stat-pill { font-size: 11px; padding: 2px 9px; border-radius: 20px; background: var(--bg); color: var(--ink2); border: 1px solid var(--border2); font-weight: 500; }
.stat-pill.hl { background: #FBF4E3; color: #8B6914; border-color: #D4B45A; }

.filters {
  padding: 9px 14px;
  display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none;
  background: var(--white); border-bottom: 1px solid var(--border);
}
.filters::-webkit-scrollbar { display: none; }
.fbtn {
  font-size: 11.5px; font-family: 'DM Sans', sans-serif;
  padding: 4px 10px; border-radius: 20px;
  border: 1px solid var(--border2); background: var(--white); color: var(--ink2);
  cursor: pointer; white-space: nowrap; transition: all .14s;
}
.fbtn:hover { background: var(--bg); color: var(--ink); }
.fbtn.on { background: var(--ink); color: var(--white); border-color: var(--ink); font-weight: 500; }

.content { padding: 12px 12px 48px; }

.section { margin-bottom: 12px; background: var(--white); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }

.sec-header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; cursor: pointer; user-select: none;
  border-bottom: 1px solid var(--border); transition: background .12s;
}
.sec-header:hover { background: var(--bg); }
.sec-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.sec-label { font-size: 12.5px; font-weight: 500; flex: 1; }
.sec-count { font-size: 11px; color: var(--ink3); }
.sec-chev { font-size: 11px; color: var(--ink3); transition: transform .2s; display: inline-block; }
.sec-chev.open { transform: rotate(180deg); }

.items { display: none; }
.items.open { display: block; }

.item {
  border-bottom: 1px solid var(--border);
  transition: background .1s;
}
.item:last-child { border-bottom: none; }
.item:hover { background: #FAFAF8; }
.item.done { opacity: .5; }

.item-top {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 14px 0;
  cursor: pointer;
}

.item-check {
  width: 16px; height: 16px; border-radius: 50%;
  border: 1.5px solid var(--border2); flex-shrink: 0; margin-top: 2px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; background: var(--white);
}
.item.done .item-check { background: var(--ink); border-color: var(--ink); }
.item.done .item-check::after { content: ''; width: 5px; height: 5px; background: var(--white); border-radius: 50%; }

.item-main { flex: 1; min-width: 0; }
.item-name { font-size: 13px; font-weight: 500; line-height: 1.3; cursor: pointer; }
.item.done .item-name { text-decoration: line-through; color: var(--ink3); }
.item-addr { font-size: 11.5px; color: var(--ink3); margin-top: 1px; }

.expand-btn {
  font-size: 11px; color: var(--ink3); cursor: pointer;
  padding: 0; background: none; border: none;
  flex-shrink: 0; margin-top: 3px;
  transition: color .12s;
  font-family: 'DM Sans', sans-serif;
}
.expand-btn:hover { color: var(--ink2); }

.item-detail {
  display: none;
  padding: 0 14px 10px 40px;
}
.item-detail.open { display: block; }

.item-desc {
  font-size: 12.5px; color: var(--ink2); line-height: 1.6;
  margin-bottom: 7px; margin-top: 6px;
  font-style: italic;
}

.item-tags { display: flex; gap: 4px; flex-wrap: wrap; padding-bottom: 2px; }
.tag { font-size: 10.5px; padding: 1px 7px; border-radius: 20px; }
.tag-free  { background: #EAF3DE; color: #3B6D11;  border: 1px solid #C0DD97; }
.tag-paid  { background: #FBF4E3; color: #8B6914;  border: 1px solid #D4B45A; }
.tag-book  { background: #FBEDED; color: #A32D2D;  border: 1px solid #E4A5A5; }
.tag-tip   { background: #E8EFF5; color: #185FA5;  border: 1px solid #9BBDD4; }
.tag-punk  { background: #F2EAF5; color: #6B3480;  border: 1px solid #C49DD4; }
.tag-day   { background: #F2EDE4; color: #6E5C3D;  border: 1px solid #C4AF8C; }

.add-row {
  display: flex; align-items: center; gap: 7px;
  padding: 8px 14px; color: var(--ink3); font-size: 12px;
  cursor: pointer; transition: all .12s;
  border-top: 1px dashed var(--border2);
  background: none; border-left: none; border-right: none; border-bottom: none;
  width: 100%; font-family: 'DM Sans', sans-serif;
}
.add-row:hover { background: var(--bg); color: var(--accent); }

.empty { padding: 24px 16px; text-align: center; color: var(--ink3); font-size: 13px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>Amsterdam 🌷</h1>
    <span class="sub">13–15 júna 2026</span>
  </div>
  <div class="stats-row" id="statsRow"></div>
</div>

<div class="filters" id="filters"></div>
<div class="content" id="content"></div>

  { id:2,  cat:'cs', name:'Coffeeshop Rookies',

  { id:4,  cat:'brown', name:"Café 't Smalle",

  { id:5,  cat:'brown', name:'Café de Dokter',

  { id:6,  cat:'brown', name:"In 't Aepjen",

const TAG_CLASS = {
  'zadarmo':'tag-free','ochutnávky free':'tag-free','terasa free':'tag-free','lacné':'tag-free',
  'rezervácia!':'tag-book',
  'hidden gem':'tag-tip','must-try':'tag-tip','foto':'tag-tip','miestni':'tag-tip',
  '🎲 losovanie':'tag-punk',
};
function tc(t){
  if(TAG_CLASS[t]) return TAG_CLASS[t];
  if(t.startsWith('~€')||t.includes('€')) return 'tag-paid';
  if(/hod|večer|ráno|Po |So |Po–|otv\./.test(t)) return 'tag-day';
  return 'tag-tip';
}

let doneSet = new Set(JSON.parse(localStorage.getItem('ams_done')||'[]'));
let expandSet = new Set();
let openSec = new Set(CATS.map(c=>c.id));
let filter = 'all';

function save(){ localStorage.setItem('ams_done', JSON.stringify([...doneSet])); }

function renderStats(){
  const total = DATA.length;
  const doneN = DATA.filter(d=>doneSet.has(d.id)).length;
  const freeN = DATA.filter(d=>d.tags.some(t=>['zadarmo','lacné','ochutnávky free','terasa free'].includes(t))).length;
  const punkN = DATA.filter(d=>d.tags.includes('🎲 losovanie')).length;
  document.getElementById('statsRow').innerHTML =
    `<span class="stat-pill">${total} miest</span>
     <span class="stat-pill">${freeN} zadarmo</span>
     <span class="stat-pill hl">${punkN} 🎲 losovanie</span>
     <span class="stat-pill">${doneN} hotových</span>`;
}

function renderFilters(){
  const el = document.getElementById('filters');
  el.innerHTML = [['all','Všetko'],...CATS.map(c=>[c.id,c.label])].map(([id,label])=>
    `<button class="fbtn ${filter===id?'on':''}" onclick="setFilter('${id}')">${label}</button>`
  ).join('');
}

function renderContent(){
  const el = document.getElementById('content');
  const activeCats = filter==='all' ? CATS : CATS.filter(c=>c.id===filter);
  let html = '';
  activeCats.forEach(cat => {
    const items = DATA.filter(d=>d.cat===cat.id);
    if(!items.length) return;
    const doneCount = items.filter(d=>doneSet.has(d.id)).length;
    const isOpen = openSec.has(cat.id);
    html += `<div class="section">
      <div class="sec-header" onclick="toggleSec('${cat.id}')">
        <span class="sec-dot" style="background:${cat.dot}"></span>
        <span class="sec-label">${cat.label}</span>
        <span class="sec-count">${doneCount}/${items.length}</span>
        <span class="sec-chev ${isOpen?'open':''}">▾</span>
      </div>
      <div class="items ${isOpen?'open':''}" id="items-${cat.id}">`;
    items.forEach(item=>{
      const isDone = doneSet.has(item.id);
      const isExp = expandSet.has(item.id);
      const tags = item.tags.map(t=>`<span class="tag ${tc(t)}">${t}</span>`).join('');
      html += `<div class="item ${isDone?'done':''}" id="item-${item.id}">
        <div class="item-top">
          <div class="item-check" onclick="toggleDone(${item.id}, event)"></div>
          <div class="item-main" onclick="toggleExp(${item.id})">
            <div class="item-name">${item.name}</div>
            ${item.addr ? `<div class="item-addr">📍 ${item.addr}</div>` : ''}
          </div>
          <button class="expand-btn" onclick="toggleExp(${item.id})">${isExp?'▴':'▾'}</button>
        </div>
        <div class="item-detail ${isExp?'open':''}">
          <div class="item-desc">${item.desc}</div>
          ${tags ? `<div class="item-tags">${tags}</div>` : ''}
        </div>
      </div>`;
    });
    html += `<button class="add-row" onclick="addTo('${cat.id}','${cat.label}')">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Pridať miesto
      </button></div></div>`;
  });
  el.innerHTML = html || '<div class="empty">Žiadne miesta v tejto kategórii.</div>';
}

function toggleDone(id, e){
  e.stopPropagation();
  doneSet.has(id)?doneSet.delete(id):doneSet.add(id);
  save(); render();
}

function toggleExp(id){
  expandSet.has(id)?expandSet.delete(id):expandSet.add(id);
  renderContent();
}

function toggleSec(id){
  openSec.has(id)?openSec.delete(id):openSec.add(id);
  renderContent();
}

function setFilter(id){ filter=id; renderFilters(); renderContent(); }

function addTo(catId, catLabel){
  const name = prompt(`Nové miesto — "${catLabel}":\nNázov:`);
  if(!name||!name.trim()) return;
  const addr = prompt('Adresa:')||'';
  const desc = prompt('Popis:')||'';
  const tagsRaw = prompt('Tagy (čiarkou):')||'';
  const tags = tagsRaw.split(',').map(t=>t.trim()).filter(Boolean);
  DATA.push({id: Date.now(), cat:catId, name:name.trim(), addr, desc, tags});
  render();
}

function render(){ renderStats(); renderFilters(); renderContent(); }
render();
</script>
