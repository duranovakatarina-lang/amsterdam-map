//  REÁLNE PEŠIE TRASY — OpenRouteService (zdarma)
// ═══════════════════════════════════════════════════
// 1) Kľúč zdarma: https://openrouteservice.org/dev/#/signup
// 2) Vlož ho nižšie namiesto PASTE_YOUR_ORS_KEY_HERE.
// Bez kľúča mapa funguje ďalej s odhadom (vzdušná čiara × 1.35).
const ORS_KEY = 'eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6IjJhNWEwZjFlNjdhYTQxMDA4NTY4NmQ5ZDBiNDcwYzdjIiwiaCI6Im11cm11cjY0In0=';
const ORS_URL = 'https://api.openrouteservice.org/v2/directions/foot-walking';
const ORS_GEO_URL = 'https://api.openrouteservice.org/v2/directions/foot-walking/geojson';
const routeCache = JSON.parse(localStorage.getItem('routeCache') || '{}');
const geomCache = JSON.parse(localStorage.getItem('geomCache') || '{}');
let itinSeq = 0;  // guard proti zápisu starých výsledkov po re-renderi
let routeSeq = 0; // guard pre prekreslenie trasy na mape

function saveRouteCache() {
  try { localStorage.setItem('routeCache', JSON.stringify(routeCache)); } catch (e) {}
}
function saveGeomCache() {
  try { localStorage.setItem('geomCache', JSON.stringify(geomCache)); } catch (e) {}
}
function routeKey(a, b) {
  const r = n => n.toFixed(5);
  return `${r(a[0])},${r(a[1])}>${r(b[0])},${r(b[1])}`;
}
function orsReady() { return ORS_KEY && ORS_KEY !== 'PASTE_YOUR_ORS_KEY_HERE'; }

// a,b = [lat,lng]. Vráti {meters, mins} reálnej pešej trasy alebo null pri zlyhaní.
async function fetchWalk(a, b) {
  const key = routeKey(a, b);
  if (routeCache[key]) return routeCache[key];
  if (!orsReady()) return null;
  try {
    const res = await fetch(ORS_URL, {
      method: 'POST',
      headers: { 'Authorization': ORS_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ coordinates: [[a[1], a[0]], [b[1], b[0]]] }),
    });
    if (!res.ok) return null;
    const data = await res.json();
    const sum = data.routes && data.routes[0] && data.routes[0].summary;
    if (!sum || sum.distance == null) return null;
    const out = { meters: sum.distance, mins: Math.max(1, Math.round(sum.duration / 60)) };
    routeCache[key] = out;
    saveRouteCache();
    return out;
  } catch (e) { return null; }
}

// stops = [{lat,lng},…]. Vráti geometriu reálnej pešej trasy ako [[lat,lng],…] alebo null.
async function fetchRouteGeometry(stops) {
  const coords = stops.map(p => [p.lng, p.lat]);
  const key = coords.map(c => c.map(n => n.toFixed(5)).join(',')).join('>');
  if (geomCache[key]) return geomCache[key];
  if (!orsReady()) return null;
  try {
    const res = await fetch(ORS_GEO_URL, {
      method: 'POST',
      headers: { 'Authorization': ORS_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ coordinates: coords }),
    });
    if (!res.ok) return null;
    const data = await res.json();
    const line = data.features && data.features[0] && data.features[0].geometry
      && data.features[0].geometry.coordinates;
    if (!line) return null;
    const latlngs = line.map(c => [c[1], c[0]]); // [lng,lat] → [lat,lng]
    geomCache[key] = latlngs;
    saveGeomCache();
    return latlngs;
  } catch (e) { return null; }
}

// SVG šípky pre úsek trasy (zdieľané itinerárom aj upgrade funkciou)
const LEG_SVG = `<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12l7 7 7-7"/></svg>`;

// Na pozadí nahradí odhady v itinerári reálnymi pešími trasami
async function upgradeItineraryDistances(stops, seq) {
  let totalM = 0, totalMin = 0, anyReal = false;
  for (let i = 0; i < stops.length - 1; i++) {
    const a = [stops[i].lat, stops[i].lng];
    const b = [stops[i + 1].lat, stops[i + 1].lng];
    const w = await fetchWalk(a, b);
    if (seq !== itinSeq) return; // medzitým sa pre-renderovalo
    if (w) {
      anyReal = true;
      totalM += w.meters; totalMin += w.mins;
      const el = document.getElementById(`itin-leg-${i}`);
      if (el) el.innerHTML = `${LEG_SVG} ${formatDistance(w.meters)} · ~${w.mins} min pešo`;
    } else {
      const d = map.distance(a, b) * 1.35;
      totalM += d; totalMin += Math.max(1, Math.round(d / 1000 / 5 * 60));
    }
  }
  if (seq !== itinSeq || !anyReal) return;
  const el = document.getElementById('itin-total-val');
  if (el) el.textContent = `${formatDistance(totalM)} · ~${totalMin} min`;
}

// Na pozadí nahradí odhad v sidebare reálnou pešou vzdialenosťou od používateľa
async function upgradeSidebarDistance(id, dest) {
  if (!userLatLng) return;
  const w = await fetchWalk(userLatLng, dest);
  if (!w || selectedId !== id) return;
  const el = document.getElementById('sb-dist');
  if (el) el.innerHTML = `📍 ${formatDistance(w.meters)} · ~${w.mins} min pešo od teba`;
}

// ═══════════════════════════════════════════════════
//  POI — OpenStreetMap Overpass API
// ═══════════════════════════════════════════════════

const OSM_TYPES = {
  restaurant: { label:'Reštaurácia',  icon:'🍽️', color:'#EA580C', cat:'food' },
  cafe:        { label:'Kaviareň',    icon:'☕',  color:'#92400E', cat:'food' },
  bar:         { label:'Bar',         icon:'🍺',  color:'#B45309', cat:'food' },
  pub:         { label:'Pub',         icon:'🍺',  color:'#B45309', cat:'food' },
  fast_food:   { label:'Rýchle jedlo',icon:'🍔',  color:'#DC2626', cat:'food' },
  bakery:      { label:'Pekáreň',     icon:'🥐',  color:'#D97706', cat:'food' },
  museum:      { label:'Múzeum',      icon:'🏛️', color:'#7C3AED', cat:'hidden-gem' },
  theatre:     { label:'Divadlo',     icon:'🎭',  color:'#6D28D9', cat:'hidden-gem' },
  cinema:      { label:'Kino',        icon:'🎬',  color:'#5B21B6', cat:'hidden-gem' },
  library:     { label:'Knižnica',    icon:'📚',  color:'#1D4ED8', cat:'hidden-gem' },
  attraction:  { label:'Atrakcia',    icon:'⭐',  color:'#D97706', cat:'hidden-gem' },
  viewpoint:   { label:'Vyhliadka',   icon:'👁️', color:'#059669', cat:'hidden-gem' },
  park:        { label:'Park',        icon:'🌳',  color:'#16A34A', cat:'nature' },
  hotel:       { label:'Hotel',       icon:'🏨',  color:'#475569', cat:'ubytovanie' },
  hostel:      { label:'Hostel',      icon:'🛏️', color:'#64748B', cat:'ubytovanie' },
};

function getOsmType(tags) {
  const a = tags.amenity || tags.tourism || tags.leisure;
  return OSM_TYPES[a] || null;
}

// Multiple Overpass mirrors — tried in order, first success wins
const OVERPASS_ENDPOINTS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://overpass.private.coffee/api/interpreter',
];

function makePOIIcon(color) {
  return L.divIcon({
    html: `<div style="width:11px;height:11px;background:${color};border-radius:50%;border:2.5px solid white;box-shadow:0 1px 5px rgba(0,0,0,0.32);"></div>`,
    className: '',
    iconSize: [11,11],
    iconAnchor: [5.5,5.5],
  });
}

function debouncedLoadPOIs() {
  clearTimeout(poiQueryTimer);
  poiQueryTimer = setTimeout(loadPOIs, 600);
}

async function loadPOIs() {
  if (!poisEnabled) return;
  if (map.getZoom() < 13) return;

  const b = map.getBounds();
  const bbox = `${b.getSouth().toFixed(4)},${b.getWest().toFixed(4)},${b.getNorth().toFixed(4)},${b.getEast().toFixed(4)}`;

  const query = `[out:json][timeout:15];
(
  node["amenity"~"restaurant|cafe|bar|pub|fast_food|bakery|museum|theatre|cinema|library"]["name"](${bbox});
  node["tourism"~"attraction|museum|viewpoint|hotel|hostel"]["name"](${bbox});
  node["leisure"="park"]["name"](${bbox});
)->._;
out body;`;

  let data = null;
  let lastErr = null;
  for (const endpoint of OVERPASS_ENDPOINTS) {
    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'data=' + encodeURIComponent(query),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      data = await res.json();
      break; // success
    } catch(e) {
      lastErr = e;
      console.warn(`POI endpoint failed (${endpoint}):`, e);
    }
  }

  if (data) {
    renderPOIs(data.elements.slice(0, 350));
  } else {
    console.warn('All POI endpoints failed:', lastErr);
  }
}

function renderPOIs(elements) {
  // Remove POIs outside current bounds + remove old markers
  const bounds = map.getBounds();
  Object.keys(poiMarkers).forEach(id => {
    const m = poiMarkers[id];
    if (!bounds.contains(m.getLatLng())) {
      map.removeLayer(m);
      delete poiMarkers[id];
    }
  });

  elements.forEach(el => {
    if (poiMarkers[el.id]) return; // already shown
    const type = getOsmType(el.tags);
    if (!type) return;

    poiCache[el.id] = { ...el.tags, lat: el.lat, lng: el.lon, osmId: el.id, type };

    const marker = L.marker([el.lat, el.lon], {
      icon: makePOIIcon(type.color),
      zIndexOffset: -100,
    });

    marker.on('click', (e) => {
      L.DomEvent.stopPropagation(e);
      const name = el.tags.name || 'Neznáme miesto';
      const addr = [el.tags['addr:street'], el.tags['addr:housenumber']].filter(Boolean).join(' ');

      const popup = L.popup({ className:'poi-popup', maxWidth:230, offset:[0,-2] })
        .setLatLng([el.lat, el.lon])
        .setContent(`
          <div>
            <div style="font-weight:700;font-size:14px;color:#0f172a;margin-bottom:3px;padding-right:16px;">${name}</div>
            <div style="font-size:12px;color:#64748b;margin-bottom:${addr?'4px':'10px'}">${type.icon} ${type.label}</div>
            ${addr ? `<div style="font-size:11.5px;color:#94a3b8;margin-bottom:10px;">📍 ${addr}</div>` : ''}
            <button
              onclick="addPoiToList(${el.id})"
              style="width:100%;padding:8px;background:#0f172a;color:white;border:none;border-radius:9px;font-family:Inter,sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;">
              + Pridať do môjho plánu
            </button>
          </div>`)
        .openOn(map);
    });

    if (poisEnabled) marker.addTo(map);
    poiMarkers[el.id] = marker;
  });
}

function addPoiToList(osmId) {
  const poi = poiCache[osmId];
  if (!poi) return;
  map.closePopup();

  // Pre-fill modal with OSM data
  tempLatLng = { lat: poi.lat, lng: poi.lng };
  editingId = null;

  document.getElementById('modal-title').textContent = 'Pridať miesto z mapy';
  document.getElementById('f-name').value        = poi.name || '';
  document.getElementById('f-category').value    = poi.type?.cat || 'custom';
  document.getElementById('f-price').value       = '';
  document.getElementById('f-description').value = '';
  document.getElementById('f-note').value        = '';
  document.getElementById('f-hours').value       = poi.opening_hours || '';
  document.getElementById('f-rating').value      = '';
  document.getElementById('f-photo').value       = '';

  document.getElementById('f-name').classList.remove('error');
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('f-name').focus(), 80);
}

function togglePOIs() {
  poisEnabled = !poisEnabled;
  const btn = document.getElementById('poi-toggle');
  btn.classList.toggle('active', poisEnabled);

  Object.values(poiMarkers).forEach(m => {
    if (poisEnabled) m.addTo(map);
    else map.removeLayer(m);
  });

  if (poisEnabled) loadPOIs();
}

// Solo filter: clicking a category shows ONLY that category;

function toggleCat(cat) {
  if (activeCats.size === 1 && activeCats.has(cat)) {
    activeCats = new Set(Object.keys(CATS)); // reset → show everything
  } else {
    activeCats = new Set([cat]);

  refreshMarkers();

function searchPlaces(q) {
  const results = document.getElementById('search-results');
  q = q.trim().toLowerCase();
  if (!q) { results.classList.remove('open'); results.innerHTML = ''; return; }

  const matches = places
    .filter(p => p.name.toLowerCase().includes(q))
    .slice(0, 8);

  if (!matches.length) {
    results.innerHTML = '<div class="search-empty">Žiadne miesto nenájdené</div>';
    results.classList.add('open');
    return;
  }

  results.innerHTML = matches.map(p => {
    const cat = CATS[p.category] || CATS.custom;
    const svg = `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${placeIcon(p)}</svg>`;
    return `<div class="search-result ${p.visited ? 'visited' : ''}" onclick="selectSearchResult(${p.id})">
        <div class="search-result-icon" style="background:${cat.color}">${svg}</div>
        <div>
          <div class="search-result-name">${p.name}</div>
          <div class="search-result-cat">${cat.label}${p.day ? ' · ' + DAY_LABELS[p.day] : ''}</div>
        </div>
      </div>`;
  }).join('');
  results.classList.add('open');
}

function selectSearchResult(id) {
  const p = places.find(x => x.id === id);
  if (!p) return;
  document.getElementById('search-results').classList.remove('open');
  document.getElementById('search-input').value = '';
  document.getElementById('search-input').blur();
  map.setView([p.lat, p.lng], Math.max(map.getZoom(), 15), { animate: true });
  openSidebar(id);
}

function closeSearch() {
  document.getElementById('search-results').classList.remove('open');
}

// Close search dropdown on outside click
document.addEventListener('click', e => {
  if (!e.target.closest('#search-wrap')) closeSearch();
});

function makePinIcon(place, seq = null, ghost = false) {
  const cat = CATS[place.category] || CATS.custom;
  const c = cat.color;
  const iconPath = placeIcon(place);

  // Top-right corner badge: visited (check) takes priority over planned (dot)
  let badge = '';
  if (place.visited) {
    badge = `<circle cx="34" cy="6" r="6.5" fill="#16A34A" stroke="white" stroke-width="2"/>
             <path d="M31 6l2 2 4-4" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  } else if (place.day && seq === null) {
    const dc = DAY_DOT_COLORS[place.day] || '#22C55E';
    badge = `<circle cx="34" cy="6" r="5.5" fill="${dc}" stroke="white" stroke-width="2"/>`;
  }

  // In itinerary mode show the stop's order number instead of the category glyph
  const center = (seq !== null)
    ? `<text x="20" y="20" text-anchor="middle" dominant-baseline="central"
             font-family="Inter, sans-serif" font-size="17" font-weight="800" fill="white">${seq}</text>`
    : `<g transform="translate(12.5 12.5) scale(0.625)" fill="none" stroke="white"
           stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">${iconPath}</g>`;

  // Circle pin — no tail, bigger (40×40), My Maps style
  const html = `
    <div class="pin-inner" style="filter:drop-shadow(0 3px 10px rgba(0,0,0,0.3));opacity:${place.visited ? 0.5 : 1};">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
        <circle cx="20" cy="20" r="18" fill="${c}" stroke="white" stroke-width="2.5"/>
        ${center}
        ${badge}
      </svg>
    </div>`;

  return L.divIcon({ html, className: ghost ? 'pin-ghost' : '', iconSize:[40,40], iconAnchor:[20,20] });
}

function isVisible(p) {
  if (!activeCats.has(p.category)) return false;
  if (activeDay==='all') return true;
  if (activeDay==='unplanned') return p.day===null;
  return p.day===activeDay;
}

// A specific day is selected (Sob/Ned/Pon) → itinerary mode: no clustering, numbered pins, route line
function isItineraryMode() {
  return ['saturday','sunday','monday'].includes(activeDay);
}

let ghostLayerOn = false;  // vrstva stlmených miest v pláne dňa (default vyp.)

function refreshMarkers() {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};

  const itinerary = isItineraryMode();
  const ordered = itinerary ? placesForDay(activeDay) : null;

  let n = 0;
  places.forEach(p => {
    if (!activeCats.has(p.category)) return;          // filter kategórií platí vždy
    const isStop = isVisible(p);
    if (!isStop && !(itinerary && ghostLayerOn)) return; // ghosty len v pláne dňa a keď je vrstva zapnutá

    let m;
    if (isStop) {
      n++;
      const seq = itinerary ? ordered.findIndex(x => x.id === p.id) + 1 : null;
      m = L.marker([p.lat,p.lng], { icon: makePinIcon(p, seq) });
    } else {
      // Plán dňa: ostatné miesta ako stlmené „ghost" piny pod číslovanými
      m = L.marker([p.lat,p.lng], { icon: makePinIcon(p, null, true), opacity: 0.4, zIndexOffset: -500 });
    }
    m.placeId = p.id;
    m.on('click', () => { if (!addingMode) openSidebar(p.id); });
    m.addTo(map);
    markers[p.id] = m;
  });

  document.getElementById('place-count').textContent = n;
  drawRoute();
  if (selectedId) setSelectedPin(selectedId);
}

// Highlight the marker for the currently open place
function setSelectedPin(id) {
  document.querySelectorAll('.leaflet-marker-icon.pin-selected')
    .forEach(el => el.classList.remove('pin-selected'));
  const m = markers[id];
  if (m && m.getElement) {
    const el = m.getElement();
    if (el) el.classList.add('pin-selected');
  }
}

// ── Rámovanie hero fotky: výplň/celé + zvislá pozícia výrezu ──
let _heroHintTimer = null;

function applyHeroFraming(p) {
  const hero   = document.getElementById('sb-hero');
  const heroBg = document.getElementById('sb-hero-bg');
  const fitBtn = document.getElementById('sb-fit');
  const hint   = document.getElementById('sb-drag-hint');

  hero.classList.toggle('has-photo', !!p.photo);
  if (!p.photo) {
    hero.classList.remove('fit-contain');
    if (hint) hint.classList.remove('show');
    if (_heroHintTimer) { clearTimeout(_heroHintTimer); _heroHintTimer = null; }
    return;
  }

  const contain = p.photoFit === 'contain';
  const pos = (p.photoPos != null) ? p.photoPos : 50;   // 0 = horný okraj, 100 = spodný

  heroBg.classList.toggle('contain', contain);
  hero.classList.toggle('fit-contain', contain);
  heroBg.style.backgroundPosition = `50% ${pos}%`;

  // Tlačidlo prepínača
  fitBtn.innerHTML = contain
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg> Vyplniť`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg> Celé`;

  // Hint „potiahni" len v režime výplň, krátko po otvorení
  if (hint) {
    hint.classList.remove('show');
    if (_heroHintTimer) clearTimeout(_heroHintTimer);
    if (!contain) {
      requestAnimationFrame(() => hint.classList.add('show'));
      _heroHintTimer = setTimeout(() => hint.classList.remove('show'), 2200);
    }
  }
}

function toggleHeroFit(ev) {
  if (ev) ev.stopPropagation();
  const p = places.find(x => x.id === selectedId);
  if (!p || !p.photo) return;
  p.photoFit = (p.photoFit === 'contain') ? 'cover' : 'contain';
  applyHeroFraming(p);
  save();
}

function setupHeroDrag(p) {
  const hero   = document.getElementById('sb-hero');
  const heroBg = document.getElementById('sb-hero-bg');
  // Vyčisti predošlé poslucháče (uchovaj referenciu na elemente)
  if (heroBg._dragCleanup) heroBg._dragCleanup();
  if (!p.photo) return;

  let dragging = false, startY = 0, startPos = 50;

  const onDown = (e) => {
    const place = places.find(x => x.id === selectedId);
    if (!place || !place.photo || place.photoFit === 'contain') return;  // v režime „celé" sa neťahá
    dragging = true;
    startY = (e.touches ? e.touches[0].clientY : e.clientY);
    startPos = (place.photoPos != null) ? place.photoPos : 50;
    hero.classList.add('dragging');
    document.getElementById('sb-drag-hint').classList.remove('show');
    e.preventDefault();
  };
  const onMove = (e) => {
    if (!dragging) return;
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    // posun o výšku hero ≈ celý rozsah 0–100 %
    const delta = (y - startY) / hero.offsetHeight * 100;
    let pos = Math.max(0, Math.min(100, startPos - delta));
    const place = places.find(x => x.id === selectedId);
    if (place) { place.photoPos = pos; heroBg.style.backgroundPosition = `50% ${pos}%`; }
    e.preventDefault();
  };
  const onUp = () => {
    if (!dragging) return;
    dragging = false;
    hero.classList.remove('dragging');
    save();   // ulož finálnu pozíciu
  };

  heroBg.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  heroBg.addEventListener('touchstart', onDown, { passive:false });
  window.addEventListener('touchmove', onMove, { passive:false });
  window.addEventListener('touchend', onUp);

  heroBg._dragCleanup = () => {
    heroBg.removeEventListener('mousedown', onDown);
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
    heroBg.removeEventListener('touchstart', onDown);
    window.removeEventListener('touchmove', onMove);
    window.removeEventListener('touchend', onUp);
  };
}

function openSidebar(id) {
  const p = places.find(x => x.id === id);
  if (!p) return;
  selectedId = id;
  const cat = CATS[p.category] || CATS.custom;

  const heroBg = document.getElementById('sb-hero-bg');
  // Gradient kategórie ide na kontajner — slúži ako placeholder aj ako pozadie
  // za fotkou v režime „zmestiť celé".
  document.getElementById('sb-hero').style.background = GRADIENTS[p.category] || GRADIENTS.custom;
  if (p.photo) {
    const img = new Image();
    img.onload = () => { heroBg.style.backgroundImage = `url('${p.photo}')`; };
    img.src = p.photo;
  } else {
    heroBg.style.backgroundImage = '';
  }
  // Nastav rámovanie fotky (režim výplň/celé + zvislú pozíciu výrezu)
  applyHeroFraming(p);
  setupHeroDrag(p);

  document.getElementById('sb-hero-badge').innerHTML =
    `<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${placeIcon(p)}</svg> ${cat.label}`;
  document.getElementById('sb-hero-name').textContent = p.name;

  const starsHtml = p.rating ? `
    <div class="sb-rating">
      <span class="sb-stars">${'★'.repeat(Math.round(p.rating))}${'☆'.repeat(5-Math.round(p.rating))}</span>
      <span style="font-weight:600;color:#0f172a;">${p.rating.toFixed(1)}</span>
    </div>` : '';

  // Distance from user location (ak polohu nemáme, ponúkni ju zapnúť)
  let distHtml = '';
  if (userLatLng) {
    const air = map.distance(userLatLng, [p.lat, p.lng]) * 1.35;
    distHtml = `<div class="sb-distance" id="sb-dist">📍 ${formatDistance(air)} od teba</div>`;
  } else {
    distHtml = `<div class="sb-distance sb-distance-cta" onclick="locateMe()" title="Zapne tvoju polohu a ukáže vzdialenosť">📍 Zistiť vzdialenosť odo mňa</div>`;
  }

  const chips = [
    p.hours ? `<span class="sb-chip"><span class="sb-chip-icon">🕐</span>${p.hours}</span>` : '',
    p.price ? `<span class="sb-chip"><span class="sb-chip-icon">💶</span>${p.price}</span>` : '',
  ].filter(Boolean).join('');

  const noteHtml = p.note
    ? `<div class="sb-note"><span class="sb-note-icon">💡</span><span>${p.note}</span></div>`
    : '';

  const planStatus = p.day
    ? `<div class="sb-plan-status planned">✅ V pláne: ${DAY_LABELS[p.day]}</div>`
    : `<div class="sb-plan-status">Nepridané do plánu dňa</div>`;

  const planBtns = ['saturday','sunday','monday'].map(d =>
    `<button class="plan-btn ${p.day===d?'sel-'+d:''}" onclick="setPlanDay(${p.id},'${d}')">${DAY_LABELS[d]}</button>`
  ).join('') + (p.day
    ? `<button class="plan-btn sel-remove" onclick="setPlanDay(${p.id},null)">× Odstrániť</button>`
    : '');

  document.getElementById('sb-body').innerHTML = `
    ${starsHtml}
    ${distHtml}
    ${chips ? `<div class="sb-chips">${chips}</div>` : ''}
    ${noteHtml}
    ${p.description ? `<p class="sb-desc">${p.description}</p>` : ''}

    <div class="sb-divider"></div>
    <div class="sb-section-label">Plán dňa</div>
    ${planStatus}
    <div class="sb-plan-btns">${planBtns}</div>

    <button class="sb-visited-btn ${p.visited ? 'done' : ''}" onclick="toggleVisited(${p.id})">

// ═══════════════════════════════════════════════════

function setPlanDay(id, day) {
  const p = places.find(x => x.id === id);
  if (!p) return;
  p.day = day;
  if (day) {
    const maxOrder = Math.max(0, ...places.filter(x => x.day === day && x.id !== id).map(x => x.order || 0));
    p.order = maxOrder + 1;
  } else {
    p.order = null;
  }
  save();
  refreshMarkers();
  if (selectedId === id) openSidebar(id);
  renderItinerary();
}

function toggleVisited(id) {
  const p = places.find(x => x.id === id);
  if (!p) return;
  p.visited = !p.visited;
  save();
  refreshMarkers();
  openSidebar(id);
  renderItinerary();
}

// ═══════════════════════════════════════════════════
//  ITINERARY
// ═══════════════════════════════════════════════════

function placesForDay(day) {
  return places.filter(p => p.day === day)
    .sort((a, b) => (a.order ?? 1e9) - (b.order ?? 1e9));
}

function normalizeDayOrders(day) {
  placesForDay(day).forEach((p, i) => { p.order = i + 1; });
}

// Walking estimate: straight-line × 1.35 detour factor, 5 km/h
function walkEstimate(meters) {
  const walkM = meters * 1.35;
  const mins = Math.max(1, Math.round(walkM / 1000 / 5 * 60));
  return { dist: formatDistance(walkM), mins };
}

function drawRoute() {
  if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
  if (!isItineraryMode()) return;
  const stops = placesForDay(activeDay);
  if (stops.length < 2) return;
  const seq = ++routeSeq;
  // Okamžitá rovná prerušovaná čiara (fallback / kým príde reálna trasa)
  routeLine = L.polyline(stops.map(p => [p.lat, p.lng]), {
    color: '#0F172A', weight: 3, opacity: 0.5, dashArray: '1 9', lineCap: 'round',
  }).addTo(map);
  // Upgrade na reálnu pešiu trasu po uliciach (plná čiara)
  if (orsReady()) fetchRouteGeometry(stops).then(latlngs => {
    if (!latlngs || seq !== routeSeq || !isItineraryMode()) return;
    if (routeLine) map.removeLayer(routeLine);
    routeLine = L.polyline(latlngs, {
      color: '#0F172A', weight: 4, opacity: 0.6, lineCap: 'round', lineJoin: 'round',
    }).addTo(map);
  });
}

function updateItineraryUI() {
  const toggle = document.getElementById('itinerary-toggle');
  const ghostBtn = document.getElementById('ghost-btn');
  if (isItineraryMode()) {
    toggle.style.display = '';
    ghostBtn.style.display = '';
    ghostBtn.classList.toggle('active', ghostLayerOn);
    renderItinerary();
  } else {
    toggle.style.display = 'none';
    ghostBtn.style.display = 'none';
    closeItineraryPanel();
  }
}

// Zapne/vypne vrstvu stlmených „ghost" pinov ostatných miest (len v pláne dňa)
function toggleGhostLayer() {
  ghostLayerOn = !ghostLayerOn;
  document.getElementById('ghost-btn').classList.toggle('active', ghostLayerOn);
  refreshMarkers();
}

function toggleItineraryPanel() {
  const panel = document.getElementById('itinerary-panel');
  if (panel.classList.contains('open')) {
    panel.classList.remove('open');
  } else {
    renderItinerary();
    panel.classList.add('open');
    closeSidebar();
    closeFoodPanel();
  }
}

function closeItineraryPanel() {
  document.getElementById('itinerary-panel').classList.remove('open');
}

function moveStop(id, dir) {
  normalizeDayOrders(activeDay);
  const stops = placesForDay(activeDay);
  const idx = stops.findIndex(p => p.id === id);
  const swapIdx = idx + dir;
  if (swapIdx < 0 || swapIdx >= stops.length) return;
  const tmp = stops[idx].order;
  stops[idx].order = stops[swapIdx].order;
  stops[swapIdx].order = tmp;
  save();
  refreshMarkers();
  renderItinerary();
}

function renderItinerary() {
  if (!isItineraryMode()) return;
  const stops = placesForDay(activeDay);
  document.getElementById('itin-title').textContent = 'Plán · ' + DAY_LABELS[activeDay];
  const body = document.getElementById('itin-body');
  const sub = document.getElementById('itin-sub');
  const footer = document.getElementById('itin-footer');

  if (!stops.length) {
    sub.textContent = 'Žiadne zastávky';
    body.innerHTML = `<div class="itin-empty">Zatiaľ nič v pláne pre tento deň.<br>Otvor miesto na mape a pridaj ho cez „Plán dňa".</div>`;
    footer.innerHTML = '';
    return;
  }

  const seq = ++itinSeq;
  let totalMeters = 0;

  const rows = stops.map((p, i) => {
    const cat = CATS[p.category] || CATS.custom;
    let legHtml = '';
    if (i < stops.length - 1) {
      const next = stops[i + 1];
      const d = map.distance([p.lat, p.lng], [next.lat, next.lng]);
      totalMeters += d;
      const est = walkEstimate(d);
      legHtml = `<div class="itin-leg" id="itin-leg-${i}">${LEG_SVG} ${est.dist} · ~${est.mins} min pešo</div>`;
    }
    return `
      <div class="itin-stop ${p.visited ? 'visited' : ''}">
        <div class="itin-num" style="background:${cat.color}">${i + 1}</div>
        <div class="itin-stop-main" onclick="selectSearchResult(${p.id})">
          <div class="itin-stop-name">${p.name}</div>
          <div class="itin-stop-cat">${cat.label}${p.hours ? ' · ' + p.hours : ''}</div>
        </div>
        <div class="itin-stop-actions">
          <button onclick="moveStop(${p.id},-1)" ${i === 0 ? 'disabled' : ''} title="Hore">↑</button>
          <button onclick="moveStop(${p.id},1)" ${i === stops.length - 1 ? 'disabled' : ''} title="Dole">↓</button>
          <button class="itin-remove" onclick="setPlanDay(${p.id},null)" title="Odobrať z plánu">×</button>
        </div>
      </div>
      ${legHtml}`;
  }).join('');

  body.innerHTML = rows;
  sub.textContent = `${stops.length} ${stops.length === 1 ? 'zastávka' : stops.length < 5 ? 'zastávky' : 'zastávok'}`;
  if (stops.length > 1) {
    const total = walkEstimate(totalMeters);
    footer.innerHTML = `<div class="itin-total"><span>Spolu pešo medzi zastávkami</span><span id="itin-total-val">${total.dist} · ~${total.mins} min</span></div>`;
    if (orsReady()) upgradeItineraryDistances(stops, seq);
  } else {
    footer.innerHTML = '';
  }
}

function savePlace() {
  const nameEl = document.getElementById('f-name');
  const name = nameEl.value.trim();
  if (!name) { nameEl.classList.add('error'); nameEl.focus(); return; }
  nameEl.classList.remove('error');

  const data = {
    name,
    addr:        document.getElementById('f-addr').value.trim(),
    category:    document.getElementById('f-category').value,
    price:       document.getElementById('f-price').value.trim(),
    description: document.getElementById('f-description').value.trim(),
    note:        document.getElementById('f-note').value.trim(),
    hours:       document.getElementById('f-hours').value.trim(),
    rating:      parseFloat(document.getElementById('f-rating').value) || null,
    photo:       document.getElementById('f-photo').value.trim() || null,
  };

  if (editingId) {
    Object.assign(places.find(x => x.id === editingId), data);
    save(); refreshMarkers(); closeModal(); openSidebar(editingId);
  } else {
    if (!tempLatLng) { closeModal(); return; }
    // časové unikátne ID — aby pri pridávaní z viacerých zariadení nevznikol konflikt
    const p = { id:Date.now(), lat:tempLatLng.lat, lng:tempLatLng.lng, day:null, order:null, visited:false, isCustom:true, ...data };
    places.push(p); save();
    if (tempMarker) { map.removeLayer(tempMarker); tempMarker = null; }
    refreshMarkers(); closeModal(); openSidebar(p.id);
  }
}

// ═══════════════════════════════════════════════════
//  GEOCODING — OpenStreetMap Nominatim (free, no key)
// ═══════════════════════════════════════════════════

// Street name = text before the house number (and before any comma)
function addrStreet(addr) {
  return addr.split(',')[0].replace(/\s+\d.*$/, '').trim();
}
// Trailing house number token, e.g. "145", "2a", "84-H" → "84"
function addrNumber(addr) {
  const m = addr.split(',')[0].match(/\s(\d+)\s*\w?\s*$/);
  return m ? m[1].toLowerCase() : null;
}

// Geocode by STREET ADDRESS (far more reliable than business name).
// A result is accepted only if the street name matches AND, when the address
// has a house number, the returned house number matches too — so a wrong
// fallback match (e.g. same number on a different street) is rejected and the
// existing coordinate is kept.
async function geocodeAllPlaces() {
  const btn = document.getElementById('geocode-btn');
  const banner = document.getElementById('add-banner');

  const targets = places.filter(p => p.addr && p.addr.trim());
  if (!targets.length) return;

  btn.disabled = true;
  btn.innerHTML = '⏳ Prebieha...';
  btn.style.color = '';
  banner.classList.add('visible');

  let updated = 0, kept = 0;

  for (let i = 0; i < targets.length; i++) {
    const p = targets[i];
    const hasCity = /amsterdam|zaandam|schiphol|centraal/i.test(p.addr);
    const query = hasCity ? p.addr : p.addr + ', Amsterdam';
    banner.textContent = `🔍 Overujem polohy ${i + 1}/${targets.length}: ${p.name}`;

    try {
      const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}`
        + `&format=json&addressdetails=1&limit=1&countrycodes=nl`;
      const res = await fetch(url, { headers: { 'Accept-Language': 'sk,en' } });
      const data = await res.json();

      if (data && data.length) {
        const r = data[0];
        const lat = parseFloat(r.lat), lon = parseFloat(r.lon);
        const inBbox = lat > 52.0 && lat < 52.6 && lon > 4.5 && lon < 5.2;
        const dn = (r.display_name || '').toLowerCase();
        const streetOk = dn.includes(addrStreet(p.addr).toLowerCase());
        const num = addrNumber(p.addr);
        const gotNum = r.address && r.address.house_number ? String(r.address.house_number).toLowerCase() : null;
        const numOk = !num || (gotNum && gotNum.split(/[-\s]/)[0] === num);

        if (inBbox && streetOk && numOk) {
          p.lat = lat; p.lng = lon; updated++;
        } else { kept++; }
      } else { kept++; }
    } catch (e) { kept++; }

    await new Promise(r => setTimeout(r, 1100)); // Nominatim: ≤1 req/s
  }

  save();
  refreshMarkers();
  if (selectedId) openSidebar(selectedId);

  banner.textContent = `✅ Hotovo · ${updated} overených, ${kept} ponechaných`;
  btn.innerHTML = '✓ Overené';
  btn.style.color = '#16A34A';
  setTimeout(() => {
    banner.classList.remove('visible');
    banner.textContent = '📍 Klikni na mapu kde chceš pridať miesto · ESC zruší';
  }, 4000);
}

// ═══════════════════════════════════════════════════
//  PHOTOS — natiahnutie úvodnej fotky z Wikipédie podľa
//  kurátorovaného titulu (WIKI_PHOTOS). Len overené tituly →
//  nikdy zlá fotka. Miss/chyba → ticho preskočí (ostáva gradient).
// ═══════════════════════════════════════════════════
async function fetchPhotos(opts = {}) {
  const silent = !!opts.silent;
  const btn = document.getElementById('photos-btn');

  // miesta s kurátorovaným titulom, ktoré ešte nemajú fotku
  // (ručne vloženú fotku — photoAuto !== true — nikdy neprepisujeme)
  const targets = places.filter(p =>
    WIKI_PHOTOS[p.id] && (!p.photo || p.photoAuto));
  if (!targets.length) {
    if (btn) { btn.innerHTML = '✓ Fotky'; btn.style.color = '#16A34A'; }
    return;
  }

  if (btn && !silent) { btn.disabled = true; btn.innerHTML = '⏳ Sťahujem...'; btn.style.color = ''; }

  let added = 0;
  for (let i = 0; i < targets.length; i++) {
    const p = targets[i];
    const { title, lang } = WIKI_PHOTOS[p.id];
    if (btn && !silent) btn.innerHTML = `⏳ ${i + 1}/${targets.length}`;

    try {
      const url = `https://${lang}.wikipedia.org/w/api.php?action=query&format=json`
        + `&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=800&redirects=1`
        + `&titles=${encodeURIComponent(title)}`;
      const res = await fetch(url);
      const data = await res.json();
      const pages = data && data.query && data.query.pages;
      let src = null;
      if (pages) {
        for (const k in pages) {
          const t = pages[k].thumbnail;
          if (t && t.source) { src = t.source; break; }
        }
      }
      if (src) {
        p.photo = src;
        p.photoAuto = true;
        added++;
        if (selectedId === p.id) openSidebar(p.id);
      }
    } catch (e) { /* miss → necháme gradient */ }

    if (added) save();
    await new Promise(r => setTimeout(r, 300));
  }

  save();
  localStorage.setItem('photos_v1_done', '1');
  if (btn && !silent) {
    btn.disabled = false;
    btn.innerHTML = '✓ Fotky';
    btn.style.color = '#16A34A';
  }
}

let checklist = [];        // FOOD_DEFAULTS + custom položky (zostavené)
let checkDone  = {};       // id → true (zdieľané odškrtnutia)
let foodExpanded = null;   // id práve rozbalenej položky

function customFoodItems(){ return checklist.filter(f => f.custom); }

function loadFood(){
  try { checkDone = JSON.parse(localStorage.getItem('amsterdam_food_done') || '{}') || {}; } catch(e){ checkDone = {}; }
  let custom = [];
  try { custom = JSON.parse(localStorage.getItem('amsterdam_food') || '[]') || []; } catch(e){ custom = []; }
  rebuildChecklist(custom);
}
function saveFood(){
  try {
    localStorage.setItem('amsterdam_food', JSON.stringify(customFoodItems()));
    localStorage.setItem('amsterdam_food_done', JSON.stringify(checkDone));
  } catch(e){}
}
// Zostav zoznam: defaulty (vždy) + custom položky (zachovaj poradie pridania)
function rebuildChecklist(customItems){
  const custom = customItems !== undefined ? customItems : customFoodItems();
  checklist = FOOD_DEFAULTS.map(d => ({ ...d, custom:false })).concat(custom.map(c => ({ ...c, custom:true })));
}
// Pri prevzatí cloud stavu: nahraď custom položky cloudovými, zjednoť odškrtnutia
function adoptCloudFood(data){
  if (data.checkDone && typeof data.checkDone === 'object') {
    checkDone = { ...checkDone, ...data.checkDone };   // OR cez kľúče — odškrtnuté ostáva odškrtnuté
  }
  if (Array.isArray(data.checklist)) {
    rebuildChecklist(data.checklist);
  } else {
    rebuildChecklist();
  }
  saveFood();
}

function toggleFoodPanel(){
  const panel = document.getElementById('food-panel');
  const open = panel.classList.toggle('open');
  document.getElementById('food-fab').classList.toggle('active', open);
  if (open) { closeItineraryPanel(); renderChecklist(); }
}
function closeFoodPanel(){
  document.getElementById('food-panel').classList.remove('open');
  document.getElementById('food-fab').classList.remove('active');
}

function renderChecklist(){
  const body = document.getElementById('food-body');
  if (!body) return;
  const doneCount = checklist.filter(f => checkDone[f.id]).length;
  const total = checklist.length;
  const fill = document.getElementById('food-bar-fill');
  if (fill) fill.style.width = (total ? Math.round(doneCount / total * 100) : 0) + '%';
  const label = document.getElementById('food-progress-label');
  if (label) label.textContent = `${doneCount} / ${total}`;

  // Badge na kolečku
  const badge = document.getElementById('food-fab-badge');
  if (badge) { badge.textContent = doneCount; badge.classList.toggle('show', doneCount > 0); }

  body.innerHTML = checklist.map(f => {
    const done = !!checkDone[f.id];
    const exp = foodExpanded === f.id;
    const detail = `<div class="food-detail">`
      + (f.desc ? `<p>${esc(f.desc)}</p>` : '')
      + (f.fact ? `<div class="fd-meta">💡 ${esc(f.fact)}</div>` : '')
      + (f.price ? `<div class="fd-meta"><b>💶</b> ${esc(f.price)}</div>` : '')
      + (f.where ? `<div class="fd-meta"><b>📍</b> ${esc(f.where)}</div>` : '')
      + `</div>`;
    return `<div class="food-item ${done?'done':''} ${exp?'expanded':''}" data-id="${f.id}">
      <div class="food-row">
        <div class="food-check" onclick="toggleChecked('${f.id}')" title="Odškrtnúť – už sme ochutnali">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span class="food-emoji">${f.emoji || '🍽️'}</span>
        <div class="food-main" onclick="toggleFoodDetail('${f.id}')">
          <div class="food-name">${esc(f.name)}</div>
        </div>
        ${f.custom ? `<button class="food-remove" onclick="deleteFoodItem('${f.id}')" title="Odstrániť položku">🗑️</button>` : ''}
        <div class="food-chevron" onclick="toggleFoodDetail('${f.id}')">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>
      ${detail}
    </div>`;
  }).join('');
}
// jednoduchý escaper pre vkladaný text
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function toggleChecked(id){
  if (checkDone[id]) delete checkDone[id]; else checkDone[id] = true;
  saveFood(); renderChecklist(); cloudPush();
}
function toggleFoodDetail(id){
  foodExpanded = (foodExpanded === id) ? null : id;
  renderChecklist();
}

function showFoodForm(){
  document.getElementById('food-add-btn').style.display = 'none';
  document.getElementById('food-add-form').classList.add('open');

}
function hideFoodForm(){
  document.getElementById('food-add-form').classList.remove('open');
  document.getElementById('food-add-btn').style.display = '';

function addFoodItem(){
  const name = document.getElementById('ff-name').value.trim();
  if (!name) { document.getElementById('ff-name').focus(); return; }
  const item = {
    id: 'c' + Date.now(),
    emoji: '🍽️',

function deleteFoodItem(id){
  const f = checklist.find(x => x.id === id);

  if (!confirm(`Odstrániť „${f.name}" zo zoznamu?`)) return;
  checklist = checklist.filter(x => x.id !== id);
  delete checkDone[id];
  saveFood(); renderChecklist(); cloudPush();
}

const LOTTO_KEY = 'lotto_sunday_v1';
let lotto = { step:0, results:[], jokers:{ swap:false, redraw:false } };
let lottoAnimating = false;

function lhtml(s){ return String(s==null?'':s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function loadLotto(){
  try {
    const s = JSON.parse(localStorage.getItem(LOTTO_KEY) || 'null');
    if (s && typeof s === 'object') {
      lotto = {
        step: Math.max(0, s.step|0),
        results: Array.isArray(s.results) ? s.results : [],
        jokers: { swap: !!(s.jokers && s.jokers.swap), redraw: !!(s.jokers && s.jokers.redraw) }
      };
    }
  } catch(e){}
  updateLottoBadge();
}
function saveLotto(){ try { localStorage.setItem(LOTTO_KEY, JSON.stringify(lotto)); } catch(e){} updateLottoBadge(); }

function updateLottoBadge(){
  const b = document.getElementById('lotto-fab-badge'); if (!b) return;
  const total = SUNDAY_PLAN.length;
  const inProgress = lotto.step > 0 && lotto.step < total;
  if (inProgress) { b.textContent = lotto.step + 1; b.classList.add('show'); }

  el.classList.remove('open'); el.setAttribute('aria-hidden','true');
  const cf = document.getElementById('lotto-confetti'); if (cf) cf.innerHTML = '';
}
function resetLotto(){
  if (!confirm('Začať nedeľný program odznova?')) return;
  lotto = { step:0, results:[], jokers:{ swap:false, redraw:false } };
  saveLotto(); renderLottoStep();
}

function renderLottoDots(){
  const dots = document.getElementById('lotto-dots'); if (!dots) return;
  const total = SUNDAY_PLAN.length;
  let html = '';
  for (let i=0;i<total;i++){
    const cls = 'ldot' + (i < lotto.step ? ' done' : '') + (i === lotto.step ? ' current' : '');
    html += `<div class="${cls}"></div>`;
  }
  dots.innerHTML = html;
}

function renderLottoStep(){
  lottoAnimating = false;
  renderLottoDots();
  const total = SUNDAY_PLAN.length;
  const label = document.getElementById('lotto-step-label');
  const stage = document.getElementById('lotto-stage');
  if (lotto.step >= total){ label.textContent = 'Nedeľa'; renderLottoEnd(); return; }
  label.textContent = 'Nedeľa · ' + (lotto.step+1) + '/' + total;
  const round = SUNDAY_PLAN[lotto.step];
  if (round.type === 'challenge'){ revealChallenge(round); return; }
  const res = lotto.results[lotto.step];
  stage.innerHTML = duelHTML(round, res && res.winner ? res.winner : null);
  stage.scrollTop = 0;

function cardHTML(r, side, cls){
  const hasPhoto = !!r.photo;
  const fallback = (CATS[r.category] && CATS[r.category].color) || '#94a3b8';
  const posY = r.photoPos ? `;background-position:center ${r.photoPos}` : '';
  const media = hasPhoto
    ? `style="background-color:${fallback};background-image:linear-gradient(180deg,rgba(15,23,42,0) 35%,rgba(15,23,42,0.5)),url('${encodeURI(r.photo)}')${posY}"`
    : `style="background:${GRADIENTS[r.category] || GRADIENTS.custom}"`;
  const icon = !hasPhoto
    ? `<svg class="lc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${r.iconSvg}</svg>`
    : '';
  return `<div class="${cls}" data-side="${side}">
    <div class="lc-media" ${media}>${icon}</div>
    <div class="lc-body"><div class="lc-name">${lhtml(r.name)}</div>${r.type?`<div class="lc-type">${lhtml(r.type)}</div>`:''}</div>
  </div>`;
}

function duelHTML(round, winner){
  const A = resolveOption(round.a), B = resolveOption(round.b);
  const drawn = !!winner;
  const cardCls = s => 'lotto-card' + (drawn ? (s === winner ? ' win' : ' lose') : '');
  let actions;
  if (!drawn){
    actions = `<div class="lotto-actions"><button class="lotto-btn" onclick="drawDuel()">${LSVG.dice} Losovať</button></div>`;
  } else {
    const W = winner === 'a' ? A : B;
    const L = winner === 'a' ? B : A;
    const winNote = W.kind === 'type'
      ? `<div class="lotto-win-note">Vyšlo: <b>${lhtml(W.name)}</b> — konkrétne miesto je na vás.</div>`
      : `<div class="lotto-win-note">Vyšlo: <b>${lhtml(W.type || W.name)}</b></div>`;
    const mapBtn = (W.placeId != null)
      ? `<button class="lotto-btn secondary" onclick="lottoShowOnMap(${W.placeId})">${LSVG.map} Ukáž na mape</button>` : '';
    const nextLabel = round.challenge ? 'Ďalej na challenge →' : 'Hotovo, ďalej →';
    actions = winNote + jokersHTML() +
      `<div class="lotto-actions">${mapBtn}<button class="lotto-btn" onclick="lottoNext()">${nextLabel}</button></div>`;
  }
  return lottoKicker('Kolo ' + (lotto.step+1)) +
    `<div class="lotto-title">${lhtml(round.title || 'Losovanie')}</div>
     <div class="lotto-cards">
       ${cardHTML(A,'a',cardCls('a'))}
       <div class="lotto-vs">VS</div>
       ${cardHTML(B,'b',cardCls('b'))}
     </div>` + actions;
}

function jokersHTML(){
  const s = lotto.jokers.swap, r = lotto.jokers.redraw;

    <button class="joker" onclick="useJokerSwap()" ${s?'disabled':''}>${LSVG.swap}
      <span class="jk-label">Vezmi to druhé<span class="jk-count"> · ${s?'minuté':'1×'}</span></span></button>
    <button class="joker" onclick="useJokerRedraw()" ${r?'disabled':''}>${LSVG.redraw}

// Burst konfiet — pure JS/CSS, bez knižníc
function lottoConfetti(){
  let layer = document.getElementById('lotto-confetti');
  if (!layer){
    layer = document.createElement('div');
    layer.id = 'lotto-confetti';
    (document.getElementById('lotto') || document.body).appendChild(layer);
  }
  layer.innerHTML = '';
  const colors = ['#0A5A37','#0F7A52','#34D399','#E8B43A','#FDF6E3'];
  const N = 44;
  for (let i = 0; i < N; i++){
    const b = document.createElement('div');
    b.className = 'confetti-bit' + (Math.random() < 0.4 ? ' round' : '');
    const ang = Math.random() * Math.PI * 2;
    const dist = 80 + Math.random() * 200;
    const tx = Math.cos(ang) * dist;
    const ty = Math.sin(ang) * dist * 0.7 + 120 + Math.random() * 160;   // bias nadol (gravitácia)
    b.style.setProperty('--tx', tx.toFixed(0) + 'px');
    b.style.setProperty('--ty', ty.toFixed(0) + 'px');
    b.style.setProperty('--rot', (Math.random() * 900 - 200).toFixed(0) + 'deg');
    b.style.setProperty('--delay', (Math.random() * 0.18).toFixed(2) + 's');
    b.style.background = colors[i % colors.length];
    layer.appendChild(b);
  }
  setTimeout(() => { if (layer) layer.innerHTML = ''; }, 2100);
}

// ── Mechanika ──
function drawDuel(forced){
  if (lottoAnimating) return;
  const stage = document.getElementById('lotto-stage');
  const cards = Array.from(stage.querySelectorAll('.lotto-card'));
  if (cards.length < 2) return;
  const act = stage.querySelector('.lotto-actions');
  if (act){ act.style.opacity = '0.45'; act.style.pointerEvents = 'none'; }
  lottoAnimating = true;
  const winner = forced || (Math.random() < 0.5 ? 'a' : 'b');
  const totalTicks = 16 + Math.floor(Math.random() * 6);
  let i = 0;
  function tick(){
    cards.forEach(c => c.classList.remove('flash'));
    const side = (i >= totalTicks - 1) ? winner : (i % 2 === 0 ? 'a' : 'b');
    const c = cards.find(x => x.dataset.side === side);
    if (c) c.classList.add('flash');
    i++;
    if (i < totalTicks){ setTimeout(tick, 70 + Math.pow(i/totalTicks, 2.4) * 260); }
    else { setTimeout(finishDraw, 280); }
  }
  function finishDraw(){
    lottoAnimating = false;
    lotto.results[lotto.step] = { winner };
    saveLotto();
    renderLottoStep();
  }
  tick();
}

function useJokerSwap(){
  if (lotto.jokers.swap) return;
  const res = lotto.results[lotto.step];
  if (!res || !res.winner) return;
  lotto.jokers.swap = true;
  res.winner = res.winner === 'a' ? 'b' : 'a';
  saveLotto(); renderLottoStep();
}
function useJokerRedraw(){
  if (lotto.jokers.redraw || lottoAnimating) return;
  lotto.jokers.redraw = true;
  lotto.results[lotto.step] = null;
  saveLotto();
  renderLottoStep();
  setTimeout(() => drawDuel(), 80);
}

function lottoNext(){
  const round = SUNDAY_PLAN[lotto.step];
  const res = lotto.results[lotto.step] || {};
  if (round.type === 'duel' && round.challenge && !res.challengeShown){
    res.challengeShown = true; lotto.results[lotto.step] = res; saveLotto();
    revealChallenge(round.challenge, { eyebrow: 'Challenge k miestu' });
    return;
  }
  advanceLotto();
}
function advanceLotto(){
  lotto.step++; saveLotto(); renderLottoStep();
}

function resolveChallenge(state){
  const round = SUNDAY_PLAN[lotto.step];
  if (round.type === 'challenge'){
    lotto.results[lotto.step] = { state };
  } else {
    const r = lotto.results[lotto.step] || {};
    r.challengeState = state; lotto.results[lotto.step] = r;
  }
  if (state === 'done'){          // konfety + vibrácia odmena za splnenú výzvu
    lottoConfetti();
    if (navigator.vibrate) { try { navigator.vibrate([0, 40, 30, 60]); } catch(e){} }
  }
  advanceLotto();
}

function lottoShowOnMap(id){
  closeLotto();
  const p = places.find(x => x.id === id);
  if (!p) return;
  map.setView([p.lat, p.lng], Math.max(map.getZoom(), 15), { animate:true });
  openSidebar(id);
}

function renderLottoEnd(){
  const stage = document.getElementById('lotto-stage');
  renderLottoDots();
  let items = '';
  SUNDAY_PLAN.forEach((round, i) => {
    const res = lotto.results[i] || {};
    let text = '', sub = '', skipped = false;
    if (round.type === 'challenge'){
      text = round.title;
      sub = res.state === 'done' ? 'Splnené' : 'Preskočené';
      skipped = res.state !== 'done';
    } else {
      const W = res.winner === 'b' ? resolveOption(round.b) : resolveOption(round.a);
      text = W.type || W.name; sub = round.title;
      if (round.challenge && res.challengeState){
        sub += ' · challenge ' + (res.challengeState === 'done' ? 'splnená' : 'preskočená');
      }
    }
    items += `<div class="lsum-item${skipped?' skipped':''}"><div class="lsum-num">${i+1}</div>
      <div class="lsum-text">${lhtml(text)}<small>${lhtml(sub)}</small></div></div>`;
  });
  stage.innerHTML = `<div class="lotto-end">
    <div class="lotto-end-head" style="color:var(--lacc)">${LSVG.sparkle}
      <div class="leh-title">Dobrú noc!</div>
      <div class="leh-sub">A teraz povedz, čo sa ti najviac páčilo :)</div></div>
    <div class="lotto-summary">${items}</div>
    <div class="lotto-actions"><button class="lotto-btn" onclick="resetLotto()">Začať deň odznova</button></div>
  </div>`;
}

// Escape zatvorí losovačku, ak je otvorená
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    const el = document.getElementById('lotto');
    if (el && el.classList.contains('open')) closeLotto();
  }
});

// Keep panels glued just below the top bar, whatever its real height is
function syncTopbarHeight(){
  const tb = document.getElementById('top-bar');
  if (tb) document.documentElement.style.setProperty('--topbar-h', tb.offsetHeight + 'px');
}
syncTopbarHeight();
window.addEventListener('resize', syncTopbarHeight);
new ResizeObserver(syncTopbarHeight).observe(document.getElementById('top-bar'));
</script>
